spring.application.name=FloreriaBackTest

# H2 en memoria configurado en modo de compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:mem:foreria;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Clave secreta JWT para pruebas
jwt.secret=clave-solo-para-pruebas-automaticas-1234567890
jwt.expiration-ms=86400000
# Administrador inicial para pruebas
app.admin.email=admin@prueba.com
app.admin.password=AdminPrueba123
# Orígenes permitidos para pruebas (CORS)
app.cors.allowed-origins=http://localhost:4200