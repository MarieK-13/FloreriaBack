spring.application.name=FloreriaBack

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Seguridad JWT ---
# La clave secreta NO se escribe aqui: se lee de la variable de entorno JWT_SECRET (minimo 32 caracteres).
jwt.secret=${JWT_SECRET}
# Tiempo de vida del token en milisegundos (por defecto 24 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrador inicial (opcional): si se definen ADMIN_EMAIL y ADMIN_PASSWORD, se crea al arrancar si no existe
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Origenes permitidos para el front-end (CORS), separados por comas
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
