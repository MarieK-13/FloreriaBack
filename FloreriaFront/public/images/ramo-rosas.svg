<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 440" role="img" aria-labelledby="t">
  <title id="t">Ilustración de un ramo de rosas rosadas envuelto en papel</title>
  <defs>
    <!-- Rosa: el color base sale de "fill" del <use> (currentColor) -->
    <symbol id="rosa" viewBox="-50 -50 100 100" overflow="visible">
      <circle r="40" fill="currentColor"/>
      <path d="M-38 6 C-40 -16 -26 -34 -6 -38" fill="none" stroke="#7a1f3d" stroke-opacity=".22" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M36 -12 C40 8 30 30 8 37" fill="none" stroke="#7a1f3d" stroke-opacity=".22" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-30 26 C-20 36 -4 39 8 37" fill="none" stroke="#7a1f3d" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
      <circle r="26" fill="#7a1f3d" fill-opacity=".09"/>
      <path d="M1 -3 C7 -6 11 1 6 7 C-1 13 -12 6 -10 -4 C-8 -15 7 -18 15 -10 C23 -1 19 15 5 20 C-10 25 -24 15 -24 -1" fill="none" stroke="#7a1f3d" stroke-opacity=".38" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M-27 -19 C-17 -31 -2 -33 10 -30" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <!-- Capullo -->
    <symbol id="capullo" viewBox="-20 -30 40 50" overflow="visible">
      <path d="M0 -26 C14 -18 14 2 0 8 C-14 2 -14 -18 0 -26Z" fill="currentColor"/>
      <path d="M0 -20 C6 -12 6 0 0 6" fill="none" stroke="#7a1f3d" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-11 -2 C-6 8 6 8 11 -2 L6 14 L-6 14Z" fill="#3f8a6d"/>
    </symbol>
    <!-- Hoja con nervio central -->
    <symbol id="hoja" viewBox="0 -14 64 28" overflow="visible">
      <path d="M0 0 C14 -13 42 -13 64 0 C42 13 14 13 0 0Z" fill="currentColor"/>
      <path d="M4 0 C24 -2 44 -2 60 0" fill="none" stroke="#0e3d31" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <!-- Rama de eucalipto -->
    <symbol id="eucalipto" viewBox="-10 -110 80 120" overflow="visible">
      <path d="M0 0 C4 -40 14 -76 36 -104" fill="none" stroke="#6f9c87" stroke-width="3" stroke-linecap="round"/>
      <g fill="#a9cdbb" stroke="#86b39d" stroke-width="1.5">
        <circle cx="-8" cy="-16" r="10"/><circle cx="14" cy="-28" r="10"/>
        <circle cx="0" cy="-48" r="9.5"/><circle cx="22" cy="-58" r="9"/>
        <circle cx="12" cy="-78" r="8.5"/><circle cx="34" cy="-84" r="8"/>
        <circle cx="34" cy="-106" r="7"/>
      </g>
    </symbol>
    <!-- Paniculata (flores blancas pequeñas) -->
    <symbol id="paniculata" viewBox="-30 -40 60 50" overflow="visible">
      <path d="M0 8 C-2 -6 -10 -16 -18 -24 M0 8 C2 -8 4 -20 10 -30 M0 8 C6 -4 14 -10 22 -14" fill="none" stroke="#7da893" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#fff" stroke="#e9dcd8" stroke-width="1">
        <circle cx="-18" cy="-25" r="4.5"/><circle cx="-24" cy="-18" r="3.5"/><circle cx="-12" cy="-32" r="3.5"/>
        <circle cx="10" cy="-31" r="4.5"/><circle cx="4" cy="-37" r="3.5"/><circle cx="16" cy="-36" r="3.2"/>
        <circle cx="22" cy="-15" r="4.2"/><circle cx="27" cy="-21" r="3.2"/><circle cx="17" cy="-9" r="3"/>
      </g>
    </symbol>
  </defs>

  <!-- Papel trasero -->
  <path d="M78 196 C120 176 280 176 322 196 L234 398 L166 398 Z" fill="#f5c3d0"/>
  <path d="M78 196 L166 398 L150 398 L66 206 Z" fill="#eeb0c1"/>

  <!-- Follaje de fondo -->
  <use href="#eucalipto" x="282" y="96" width="80" height="120" transform="rotate(18 292 206)"/>
  <g transform="translate(400 0) scale(-1 1)">
    <use href="#eucalipto" x="282" y="96" width="80" height="120" transform="rotate(18 292 206)"/>
  </g>
  <use href="#hoja" x="236" y="104" width="64" height="28" color="#2f7d64" transform="rotate(-34 236 118)"/>
  <use href="#hoja" x="96" y="96" width="64" height="28" color="#3f8a6d" transform="rotate(212 128 110)"/>
  <use href="#hoja" x="270" y="170" width="64" height="28" color="#3f8a6d" transform="rotate(8 270 184)"/>
  <use href="#hoja" x="60" y="176" width="64" height="28" color="#2f7d64" transform="rotate(176 92 190)"/>

  <!-- Capullos y paniculata detrás -->
  <use href="#capullo" x="178" y="22" width="40" height="50" color="#f08aa6"/>
  <use href="#capullo" x="262" y="66" width="34" height="44" color="#f7b6c6" transform="rotate(24 279 88)"/>
  <use href="#capullo" x="104" y="70" width="34" height="44" color="#e8678a" transform="rotate(-26 121 92)"/>
  <use href="#paniculata" x="118" y="40" width="60" height="50"/>
  <use href="#paniculata" x="222" y="34" width="60" height="50"/>
  <use href="#paniculata" x="276" y="132" width="56" height="46"/>
  <use href="#paniculata" x="64" y="136" width="56" height="46"/>

  <!-- Rosas -->
  <use href="#rosa" x="150" y="70" width="80" height="80" color="#f7b6c6"/>
  <use href="#rosa" x="214" y="80" width="78" height="78" color="#e8678a"/>
  <use href="#rosa" x="98" y="122" width="78" height="78" color="#e8678a"/>
  <use href="#rosa" x="248" y="138" width="72" height="72" color="#f7b6c6"/>
  <use href="#rosa" x="164" y="132" width="90" height="90" color="#f08aa6"/>
  <use href="#rosa" x="122" y="176" width="62" height="62" color="#fbd0da"/>
  <use href="#rosa" x="228" y="182" width="62" height="62" color="#e8678a"/>

  <!-- Papel delantero -->
  <path d="M92 222 C130 246 160 252 200 252 C240 252 270 246 308 222 L222 404 L178 404 Z" fill="#fffaf7"/>
  <path d="M92 222 C130 246 160 252 200 252 C240 252 270 246 308 222" fill="none" stroke="#f1d6dd" stroke-width="3"/>
  <path d="M200 252 L200 404" stroke="#f3e2e6" stroke-width="3"/>
  <path d="M92 222 L178 404 L200 404 L200 252 C160 252 130 246 92 222Z" fill="#f9ece9"/>
  <path d="M150 248 L190 404" stroke="#efdcd8" stroke-width="2"/>
  <path d="M252 248 L212 404" stroke="#f3e5e6" stroke-width="2"/>

  <!-- Lazo -->
  <g fill="#176b58">
    <path d="M200 346 C176 324 148 326 152 344 C156 362 184 360 200 350Z"/>
    <path d="M200 346 C224 324 252 326 248 344 C244 362 216 360 200 350Z"/>
    <path d="M196 352 L176 396 L188 392 L198 404 L202 356Z"/>
    <path d="M204 352 L224 396 L212 392 L202 404 L198 356Z"/>
  </g>
  <path d="M163 340 C172 334 186 338 194 346" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="190" y="338" width="20" height="18" rx="6" fill="#124f43"/>

  <!-- Tallos -->
  <g stroke="#3f8a6d" stroke-width="5" stroke-linecap="round">
    <path d="M188 404 L184 428"/><path d="M200 404 L200 432"/><path d="M212 404 L216 428"/>
  </g>
</svg>
